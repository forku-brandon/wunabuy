name: Backend CI

on:
  pull_request:
    paths: ['wunabuy-backend/**']
  push:
    branches: [main, develop]
    paths: ['wunabuy-backend/**']

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wunabuy-backend/package-lock.json
      - run: cd wunabuy-backend && npm ci
      - run: cd wunabuy-backend && npm run lint
      - run: cd wunabuy-backend && npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wunabuy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wunabuy-backend/package-lock.json
      - run: cd wunabuy-backend && npm ci
      - run: cd wunabuy-backend && npm run test:unit
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/wunabuy_test
          REDIS_URL: redis://localhost:6379
      - run: cd wunabuy-backend && npm run test:coverage

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd wunabuy-backend && npm audit --audit-level=high || true
